      <div class="section">

    <main id="content">
      <h1>Resume</h1>

      <!-- PDF Viewer -->
      <div class="pdf-container">
        <iframe 
          src="../accessories/resumes/resume_JM.pdf" 
          class="pdf-viewer">

        </a>
      </div>
    </main>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">

    <script>
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebar-overlay');
    const tab = document.getElementById('sidebar-tab');
    tab.addEventListener('click', () => {
        sidebar.classList.toggle('open');
        overlay.classList.toggle('active');
    });
    overlay.addEventListener('click', () => {
        sidebar.classList.remove('open');
        overlay.classList.remove('active');
    });
    </script>

    <script>
    document.querySelectorAll("#sidebar ul li a.active").forEach(activeLink => {
      // Find the nearest parent section
      const parentSection = activeLink.closest(".section");
      if (!parentSection) return;

      // Find the checkbox controlling this section
      const checkbox = parentSection.querySelector('input[type="checkbox"]');
      if (checkbox) {
        checkbox.checked = true;   // keep section open
        checkbox.disabled = true;  // optionally prevent collapsing
      }
    });
    </script>


    <script>
      // Get current page file name
      const currentPage = window.location.pathname.split("/").pop();

      // Select all sidebar links
      const links = document.querySelectorAll("#sidebar ul li a");

      links.forEach(link => {
        const href = link.getAttribute("href").split("/").pop();
        if (href === currentPage) {
          link.classList.add("active");
        }
      });
    </script>


  </body>
</html>
